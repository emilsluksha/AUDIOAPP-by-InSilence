name: Windows application
on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-lock.txt
      - name: Generate branding and collect notices
        run: python scripts/make_assets.py
      - name: Test
        run: python -m pytest -q
      - name: Prepare YouTube runtime
        run: python scripts/prepare_downloader.py
      - name: Build Windows distribution
        run: python -m PyInstaller --noconfirm KEYWAVE.spec
      - name: Package portable application folder
        run: python scripts/package.py
      - name: Upload runnable folder ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KEYWAVE-Windows-x64-FOLDER
          path: |
            dist/KEYWAVE-Windows-x64-folder.zip
            dist/KEYWAVE-Windows-x64-folder.zip.sha256
          if-no-files-found: error
      - name: Exercise packaged application (diagnostic)
        shell: pwsh
        continue-on-error: true
        run: |
          if (!(Test-Path dist/KEYWAVE/KEYWAVE.exe)) { throw 'Missing folder executable' }
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:KEYWAVE_SMOKE_DIR = Join-Path $pwd 'artifacts'
          $isolated = Join-Path $env:RUNNER_TEMP 'keywave-standalone'
          New-Item -ItemType Directory -Force $isolated | Out-Null
          Copy-Item dist/KEYWAVE $isolated -Recurse
          $p = Start-Process (Join-Path $isolated 'KEYWAVE/KEYWAVE.exe') -WorkingDirectory (Join-Path $isolated 'KEYWAVE') -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (!$p.WaitForExit(600000)) { $p.Kill(); throw 'Packaged smoke test timed out' }
          if ($p.ExitCode -ne 0) {
            if (Test-Path artifacts/smoke-stage.txt) { Write-Host "Failed at smoke stage: $(Get-Content artifacts/smoke-stage.txt)" }
            if (Test-Path artifacts/smoke-result.json) { Get-Content artifacts/smoke-result.json }
            throw "Packaged smoke test failed (exit $($p.ExitCode))"
          }
          $report = Get-Content artifacts/smoke-result.json | ConvertFrom-Json
          if (!$report.ok) { throw 'Packaged report failed' }
      - name: Upload verification results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification
          path: artifacts/
